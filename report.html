<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPL Ledger - GW3 Report</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><nav class="nav"><a href="index.html">FPL Ledger</a><div class="links"><a href="ledger.html">Ledger</a><a href="https://fpl-ledger-azure.vercel.app/reports/gw3">Live report ↗</a></div></nav><p class="eyebrow">Final accuracy report</p><h1 style="font-size:58px">GW3: score the forecast, then learn.</h1><div id="cards" class="grid"></div><section class="section"><h2>Active cohort by position</h2><table><thead><tr><th>Position</th><th>n</th><th>MAE</th><th>RMSE</th><th>Bias</th><th>Within +/-2</th></tr></thead><tbody id="positions"></tbody></table></section><section class="section"><h2>Largest misses</h2><table><thead><tr><th>Player</th><th>Pos</th><th>Projected</th><th>Actual</th><th>Abs. error</th></tr></thead><tbody id="misses"></tbody></table></section></main><script type="module">import{loadJson}from'./app.js';const d=await loadJson('./data/gw3-report.json');const a=d.activeCohort;document.querySelector('#cards').innerHTML=`<div class="card"><div class="metric">${a.mae.toFixed(3)}</div><div class="label">Active MAE</div></div><div class="card"><div class="metric">${a.rmse.toFixed(3)}</div><div class="label">Active RMSE</div></div><div class="card"><div class="metric">${a.within2}%</div><div class="label">Within +/-2 points</div></div>`;document.querySelector('#positions').innerHTML=Object.entries(d.byPosition).map(([k,v])=>`<tr><td><strong>${k}</strong></td><td>${v.count}</td><td>${v.mae.toFixed(3)}</td><td>${v.rmse.toFixed(3)}</td><td>${v.bias.toFixed(3)}</td><td>${v.within2}%</td></tr>`).join('');document.querySelector('#misses').innerHTML=d.largestMisses.map(v=>`<tr><td><strong>${v.name}</strong></td><td>${v.position}</td><td>${v.projected.toFixed(3)}</td><td>${v.actual}</td><td>${v.error.toFixed(3)}</td></tr>`).join('');</script></body></html>
