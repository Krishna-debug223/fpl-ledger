<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FPL Ledger - Frozen GW3</title><link rel="stylesheet" href="styles.css"></head><body><main class="wrap"><nav class="nav"><a href="index.html">FPL Ledger</a><div class="links"><a href="report.html">GW3 Report</a><a href="https://fpl-ledger-azure.vercel.app/ledger">Live ledger ↗</a></div></nav><p class="eyebrow">GW3 frozen snapshot</p><h1 style="font-size:58px">What the model believed before the deadline.</h1><p id="meta" class="lead"></p><table><thead><tr><th>Player</th><th>Pos</th><th>Fixture</th><th>xPts</th><th>Confidence</th><th>Data quality</th></tr></thead><tbody id="rows"></tbody></table><p class="note" style="margin-top:16px">This portfolio view shows a sample only. The production snapshot contains the full player pool.</p></main><script type="module">import{loadJson}from'./app.js';const d=await loadJson('./data/gw3-snapshot-meta.json');const mins=Math.round((new Date(d.deadline)-new Date(d.lockedAt))/60000);document.querySelector('#meta').textContent=`Locked ${mins} minutes before the GW${d.gameweek} deadline · ${d.modelVersion} · hash ${d.contentHash.slice(0,12)}…`;document.querySelector('#rows').innerHTML=d.sampleProjections.map(p=>`<tr><td><strong>${p.name}</strong><br><span class="note">${p.team}</span></td><td>${p.position}</td><td>${p.fixture}</td><td>${p.x.toFixed(3)}</td><td><span class="pill">${p.confidence}</span></td><td>${p.dataQuality}/100</td></tr>`).join('');</script></body></html>
