name: Freeze GW5 Ledger

on:
  push:
    paths:
      - '.github/workflows/freeze-gw5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Freeze official GW5 deadline snapshot
        run: node scripts/freeze-gw5.mjs
      - name: Commit immutable snapshot
        run: |
          git config user.name "fpl-ledger-lock-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/gw5-locked.json
          if git diff --cached --quiet; then
            echo "Snapshot unchanged"
          else
            git commit -m "Lock official GW5 deadline snapshot"
            git push origin HEAD:main
          fi
